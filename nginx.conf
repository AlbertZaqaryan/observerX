server {
    listen 80;
    server_name _;

    # Allow large uploads (files, audio, images). Keep in sync with MAX_UPLOAD_MB.
    client_max_body_size 100m;

    root /usr/share/nginx/html;
    index index.html;

    # Static frontend.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API + streaming (SSE) proxied to the FastAPI backend.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Required for Server-Sent Events: disable buffering, keep connection open.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
