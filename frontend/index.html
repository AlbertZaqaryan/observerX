<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>observerX_ai</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="styles.css" />
  <!-- Markdown rendering + sanitization (graceful fallback to plain text if offline). -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js" defer></script>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="logo">◎</span>
        <div>
          <h1>observerX_ai</h1>
          <p id="model-name" class="subtitle">Loading model…</p>
        </div>
      </div>
      <div class="header-actions">
        <span id="status-dot" class="status-dot" title="Model status"></span>
        <span id="status-text" class="status-text">checking…</span>
        <button id="new-chat" class="ghost-btn" title="Start a new conversation">New chat</button>
      </div>
    </header>

    <main id="messages" class="messages">
      <div id="empty-state" class="empty-state">
        <h2>Welcome</h2>
        <p>Chat with the model, or attach <strong>images</strong>, <strong>audio</strong>,
           <strong>documents</strong> and <strong>text files</strong>.</p>
        <ul id="capabilities" class="capabilities"></ul>
      </div>
    </main>

    <footer class="composer">
      <div id="attachments" class="attachments"></div>
      <div class="composer-row">
        <button id="attach-btn" class="icon-btn" title="Attach files">＋</button>
        <input id="file-input" type="file" multiple hidden
               accept="image/*,audio/*,.pdf,.docx,.txt,.md,.csv,.json,.py,.js,.ts,.html,.css,.log,.xml,.yaml,.yml" />
        <textarea id="input" class="input" rows="1"
                  placeholder="Send a message…  (Shift+Enter for a new line)"></textarea>
        <button id="send-btn" class="send-btn" title="Send">Send</button>
      </div>
      <p class="disclaimer">
        This is an uncensored research model. Responses may be inaccurate or offensive — use responsibly.
      </p>
    </footer>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
